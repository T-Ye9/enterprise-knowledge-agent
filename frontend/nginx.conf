limit_req_zone $binary_remote_addr zone=demo_requests:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=demo_connections:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;
    # 不把包含问题/参数的 URL 写进访问日志。
    access_log off;

    location /api/ {
        limit_req zone=demo_requests burst=5 nodelay;
        limit_req_status 429;
        limit_conn demo_connections 2;
        limit_conn_status 429;
        # 末尾 / 将 /api/chat 转为后端 /chat。
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
