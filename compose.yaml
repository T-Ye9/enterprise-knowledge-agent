name: enterprise-knowledge-agent

services:
  backend:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8001}:8000"
    volumes:
      - knowledge-data:/app/data/vector-db
      - embedding-cache:/app/.cache

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_ALLOW_DOCUMENT_UPLOAD: ${VITE_ALLOW_DOCUMENT_UPLOAD:-true}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  knowledge-data:
  embedding-cache:
